  游戏平台:
    default: 机场名称3
    icon: https://raw.githubusercontent.com/7ac9d42/Rules/main/icon/game.png
  默认代理:
    default: 机场名称3
    icon: https://raw.githubusercontent.com/7ac9d42/Rules/main/icon/select.png
  台湾限定站点:
    region: 台湾
