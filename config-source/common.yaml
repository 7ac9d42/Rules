# TG 仅对声明的机场优先政策生效；明确服务优先于 CF，每分支保留 UDP 护栏。
classification:
- match: OR,((RULE-SET,telegram_domain),(RULE-SET,telegram_ip,no-resolve))
  probe: TG
- match: OR,((DOMAIN,github.com),(DOMAIN,api.github.com),(DOMAIN,raw.githubusercontent.com),(DOMAIN,codeload.github.com),(DOMAIN,release-assets.githubusercontent.com))
  probe: GitHub
- match: OR,((RULE-SET,cloudflare_domain),(RULE-SET,cloudflare_cdn_domain),(RULE-SET,cloudflare_cdn_ipv4),(RULE-SET,cloudflare_cdn_ipv6))
  probe: CF
- match: RULE-SET,github_domain
  probe: GitHub
- match: OR,((NETWORK,tcp),(NETWORK,udp))
  probe: Google
