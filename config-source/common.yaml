    其他: ".*"
# 专用池与普通池隔离；每个模型明确业务的默认机场和地区。
sensitive-probes: [Google, CF]
# 辅助 select 共享内部选择；全部节点及低倍率入口必须显式手选。
helpers:
  自建/家宽节点:
    icon: https://raw.githubusercontent.com/7ac9d42/Rules/main/icon/private_node.png
    filter: "(?i)(自建|家宽|(?<![0-9A-Za-z_])(?:The_house|Self_Back|private|home)(?![0-9A-Za-z_]))"
  低倍率/MITM节点:
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    filter-regions: [香港, 日本, 新加坡]
    filter-tags: '(?<![0-9.])0\.(?=[0-9]*[1-9])(?:[0-4][0-9]*|50*)(?:倍|x)(?![0-9A-Za-z.])|MITM|pornhub'
    icon: https://pub-8feead0908f649a8b94397f152fb9cba.r2.dev/select.png
    proxies:
    - REJECT
  全部节点:
    proxies:
    - REJECT
manual-menu:
- 自建/家宽节点
- 全部节点
- DIRECT
