# 三／四机场的共同维护源；模型差异由同目录的 three-airports.yaml / four-airports.yaml 声明。
# 名称中的机场名称x是文本替换目标，不可缩写。规则顺序有意义。
---
# 原生 Mihomo 设置：DNS/TUN/认证等在这里修改。
settings:
  global-ua: clash.meta
  mode: rule
  mixed-port: 7890
  ipv6: false
  allow-lan: true
  unified-delay: false
  tcp-concurrent: true
  authentication: []
  skip-auth-prefixes:
  - 127.0.0.1/8
  - "::1/128"
  external-controller: 0.0.0.0:9090
  secret: 7a13b88333760a18574d3b32
  external-ui: ui
  external-ui-url: https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
  find-process-mode: 'off'
  profile:
    store-selected: true
    store-fake-ip: true
  sniffer:
    enable: true
    force-dns-mapping: true
    parse-pure-ip: true
    override-destination: false
    sniff:
      HTTP:
        ports:
        - 80
        - 8080
        - 8888
        override-destination: true
      TLS:
        ports:
        - 443
        - 8443
        - 5228-5230
      QUIC:
        ports:
        - 443
        - 8443
    skip-domain:
    - Mijia Cloud
    - "+.io.mi.com"
    - "+.apple.com"
    - "+.wechat.com"
    - "+.qpic.cn"
    - "+.qq.com"
    - "+.wechatapp.com"
    - "+.vivox.com"
    - "+.oray.com"
    - "+.sunlogin.net"
  tun:
    enable: true
    stack: system
    device: tun0
    mtu: 9000
    dns-hijack:
    - any:53
    - tcp://any:53
    strict-route: true
    auto-route: true
    auto-redirect: true
    auto-detect-interface: true
  dns:
    enable: true
    listen: 0.0.0.0:1053
    ipv6: false
    use-system-hosts: true
    prefer-h3: false
    respect-rules: true
    cache-algorithm: lru
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.0/15
    fake-ip-range6: fdfe:dcba:9876::/64
    fake-ip-filter-mode: rule
    fake-ip-filter:
    - DOMAIN,region1.v2.argotunnel.com,real-ip
    - DOMAIN,region2.v2.argotunnel.com,real-ip
    - RULE-SET,private_domain,real-ip
    - RULE-SET,stun_domain,real-ip
    - DOMAIN,connectivitycheck.gstatic.com,real-ip
    - DOMAIN-SUFFIX,msftconnecttest.com,real-ip
    - DOMAIN-SUFFIX,msftncsi.com,real-ip
    - DOMAIN-SUFFIX,pool.ntp.org,real-ip
    - DOMAIN-SUFFIX,time.windows.com,real-ip
    - DOMAIN-SUFFIX,time.apple.com,real-ip
    - DOMAIN-SUFFIX,ntp.org.cn,real-ip
    - RULE-SET,fakeip_filter_domain,real-ip
    - DOMAIN-SUFFIX,srv.nintendo.net,real-ip
    - DOMAIN-SUFFIX,stun.playstation.net,real-ip
    - DOMAIN-SUFFIX,xboxlive.com,real-ip
    - DOMAIN-SUFFIX,xbox.microsoft.com,real-ip
    - DOMAIN-SUFFIX,sandai.net,real-ip
    - DOMAIN-SUFFIX,n0808.com,real-ip
    - DOMAIN-SUFFIX,mcdn.bilivideo.cn,real-ip
    - DOMAIN-SUFFIX,proxy.golang.org,real-ip
    - DOMAIN-SUFFIX,steamserver.net,real-ip
    - RULE-SET,google_domain,fake-ip
    - RULE-SET,biliintl_domain,fake-ip
    - RULE-SET,TVB_domain,fake-ip
    - RULE-SET,proxy_domain,fake-ip
    - DOMAIN,hk.tv.global.mi.com,fake-ip
    - RULE-SET,game_cn_domain,real-ip
    - RULE-SET,steam_cn_domain,real-ip
    - RULE-SET,pt_domain,real-ip
    - RULE-SET,public-tracker_domain,real-ip
    - RULE-SET,115_domain,real-ip
    - RULE-SET,wechat_domain,real-ip
    - RULE-SET,bank_cn_domain,real-ip
    - RULE-SET,alibaba_domain,real-ip
    - RULE-SET,xiaomi_domain,real-ip
    - RULE-SET,apple_cn_domain,real-ip
    - RULE-SET,ai_cn_domain,real-ip
    - RULE-SET,NetEaseMusic_domain,real-ip
    - RULE-SET,media_cn_domain,real-ip
    - RULE-SET,iptv_domain,real-ip
    - RULE-SET,cn_domain,real-ip
    - MATCH,fake-ip
    default-nameserver:
    - https://223.5.5.5/dns-query
    proxy-server-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
    direct-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
    nameserver-policy:
      "+.argotunnel.com,+.plex.direct":
      - https://dns.alidns.com/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT
      rule-set:private_domain: rcode://name_error
      hk.tv.global.mi.com:
      - https://cloudflare-dns.com/dns-query#DNS代理
      - https://dns.google/dns-query#DNS代理
      rule-set:google_domain,biliintl_domain,TVB_domain,proxy_domain:
      - https://cloudflare-dns.com/dns-query#DNS代理
      - https://dns.google/dns-query#DNS代理
      rule-set:cn_domain,game_cn_domain,steam_cn_domain,pt_domain,public-tracker_domain,115_domain,wechat_domain,bank_cn_domain,alibaba_domain,xiaomi_domain,apple_cn_domain,ai_cn_domain,NetEaseMusic_domain,media_cn_domain,iptv_domain:
      - https://dns.alidns.com/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT
    direct-nameserver-follow-policy: true
    nameserver:
    - https://cloudflare-dns.com/dns-query#DNS代理
    - https://dns.google/dns-query#DNS代理
# 全订阅健康检查不承担自动准入；特殊节点仍须保留给显式手选。
provider-defaults:
  type: http
  interval: 86400
  health-check:
    enable: true
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    timeout: 5000
    interval: 75
    lazy: false
  exclude-filter: "(?i)(剩余流量|流量剩余|已用流量|总流量|套餐流量|套餐到期|到期时间|下次重置|重置时间|订阅到期|官方公告|使用教程|Panel[ _-]*Notice|^Expired$|(?:^|[\\s\\[【(（_|｜丨-])(?:Traffic|Remaining|Quota|Used|Total|Expire(?:d|s)?)\\s*[:：]\\s*(?:[0-9]|∞|Unlimited)|(?:^|[\\s\\[【(（_|｜丨-])Email\\s*[:：]\\s*\\S+@|(?:^|[\\s\\[【(（_|｜丨-])Panel\\s*[:：]|(?:^|[\\s\\[【(（_|｜丨-])(?:官网|客服|工单|邮箱)(?:地址|链接|入口)?(?:$|[\\s\\]】)）|｜丨:：_-]))"
  proxy: DIRECT
airports:
  机场名称1:
    provider: Airport_01
    url: 订阅链接1
    override:
      additional-prefix: "[机场名称1]"
      skip-cert-verify: false
  机场名称2:
    provider: Airport_02
    url: 订阅链接2
    override:
      additional-prefix: "[机场名称2]"
      # 此订阅整体为家宽，追加标签供共享家宽入口识别。
      additional-suffix: " [家宽]"
      skip-cert-verify: false
  机场名称3:
    provider: Airport_03
    url: 订阅链接3
    override:
      additional-prefix: "[机场名称3]"
      skip-cert-verify: false
  机场名称4:
    provider: Airport_04
    url: 订阅链接4
    override:
      additional-prefix: "[机场名称4]"
      skip-cert-verify: false
# URL 与状态码共同决定健康；单端点不代表整个服务。
probes:
  Google:
    url: https://www.gstatic.com/generate_204
    expected-status: 204
  CF:
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
  GitHub:
    url: https://github.com/robots.txt
    expected-status: 200
  # 仅机场优先链路使用；固定地区菜单继续沿用原探针。
  TG:
    url: https://flora.web.telegram.org/apiw1
    expected-status: 501
automatic-defaults:
  timeout: 5000
  max-failed-times: 3
  empty-fallback: REJECT
  hidden: true
url-test-defaults:
  tolerance: 50
fallback-defaults:
  interval: 30
  lazy: true
# 地区识别只维护一份，普通池、固定地区回退与备用排序共用。
regions:
  香港:
    match: "(?i)(香港|港|\U0001F1ED\U0001F1F0|\\bHK[0-9]*\\b|Hong ?Kong)"
    icon: https://pub-8feead0908f649a8b94397f152fb9cba.r2.dev/Hongkong.png
  日本:
    match: "(?i)(日本|\U0001F1EF\U0001F1F5|\\bJP[0-9]*\\b|Japan)"
    icon: https://pub-8feead0908f649a8b94397f152fb9cba.r2.dev/Japan.png
  新加坡:
    match: "(?i)(新加坡|狮城|\U0001F1F8\U0001F1EC|\\bSG[0-9]*\\b|Singapore)"
    icon: https://pub-8feead0908f649a8b94397f152fb9cba.r2.dev/Singapore.png
  台湾:
    match: "(?i)(台湾|台灣|臺灣|\U0001F1F9\U0001F1FC|\\bTW[0-9]*\\b|\\bTWN[0-9]*\\b|Taiwan|Taipei|New ?Taipei|台北|臺北|新北|\\bTPE[0-9]*\\b|Taichung|台中|臺中|\\bRMQ[0-9]*\\b|Tainan|台南|臺南|\\bTNN[0-9]*\\b|Kaohsiung|高雄|\\bKHH[0-9]*\\b)"
    icon: https://pub-8feead0908f649a8b94397f152fb9cba.r2.dev/Taiwan_China.png
  美国:
    match: "(?i)(美国|\U0001F1FA\U0001F1F8|\U0001F1FA\U0001F1F2|\\bUS[0-9]*\\b|\\bUSA[0-9]*\\b|America|United States|UnitedStates|Los Angeles|Chicago|Ashburn|Seattle|Kansas)"
    icon: https://pub-8feead0908f649a8b94397f152fb9cba.r2.dev/America.png
# 自动准入：普通倍率/质量规则 + 地区例外 + 全机场特殊节点排除。
admission:
  special: MITM|pornhub
  standard-exclude: "(?i)(BETA|wcloud|\\btraffic\\b|(?<![0-9.])(?:0\\.(?=[0-9]*[1-9])(?:[0-2][0-9]*|30*)|(?:[5-9]|[1-9][0-9]+)(?:\\.[0-9]+)?)(?:倍|x)(?![0-9A-Za-z.]))"
  exclude-overrides:
    机场名称3:
      美国: "(?i)(BETA|wcloud|\\btraffic\\b|(?<![0-9.])(?:[5-9]|[1-9][0-9]+)(?:\\.[0-9]+)?(?:倍|x)(?![0-9A-Za-z.]))"
  region-excludes:
    机场名称1:
      香港: Hong ?Kong 0[2-5](?:\D|$)
    机场名称3:
      日本: "(?<![0-9A-Za-z])CTCU(?![0-9A-Za-z])"
      新加坡: "(?<![0-9A-Za-z])CTCU(?![0-9A-Za-z])"
# 跨地区优先级：同机场先换地区，再跨机场；下载沿用此顺序。
airport-region-order:
  机场名称1:
  - 日本
  - 香港
  - 新加坡
  - 美国
  机场名称2:
  - 香港
  - 日本
  - 新加坡
  - 美国
  机场名称3:
  - 日本
  - 新加坡
  - 香港
  - 美国
rule-update-policy: 机场名称3优先
reserve:
  airport: 机场名称4
  region-order:
  - 香港
  - 日本
  - 新加坡
  - 美国
  - 台湾
  - 欧洲
