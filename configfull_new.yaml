# ===== 锚点定义区 =====

# ── 1. 服务策略组通用 proxies 列表 ──
# 代理优先
Proxy_first: &Proxy_first {type: select, proxies: [节点选择, 自建/家宽节点, 香港节点, 日本节点, 新加坡节点, 台湾节点, 美国节点, 欧洲节点, 全球直连, 全部节点]}
# 机场3优先（大流量/高带宽/无CF质询服务）
Airport3_first: &Airport3_first {type: select, proxies: [机场名称3地区优先, 节点选择, 自建/家宽节点, 香港节点, 日本节点, 新加坡节点, 台湾节点, 欧洲节点, 全球直连, 全部节点]}
# 直连优先（Apple/B站等国内 CDN 服务）
Direct_first: &Direct_first {type: select, proxies: [全球直连, 节点选择, 自建/家宽节点, 香港节点, 日本节点, 新加坡节点, 台湾节点, 美国节点, 欧洲节点, 全部节点]}

# ── 2. 策略组类型基础参数 ──
# url-test 空组必须判为不可用；探测频率与 lazy 保持原值
Urltest_Base: &Urltest_Base {type: url-test, tolerance: 50, interval: 180, max-failed-times: 2, lazy: false, empty-fallback: REJECT, url: "https://www.gstatic.com/generate_204", expected-status: 204, hidden: true}
# fallback 外层严格按 proxies 顺序转移；多次连接失败后强制复测
Fallback_Base: &Fallback_Base {type: fallback, url: "https://www.gstatic.com/generate_204", expected-status: 204, interval: 60, max-failed-times: 3, lazy: false}
# load-balance 同域名走同节点，lazy 仅手动启用时探测
Loadbalance_Base: &Loadbalance_Base {type: load-balance, strategy: consistent-hashing, url: "https://www.gstatic.com/generate_204", expected-status: 204, interval: 180, max-failed-times: 3, lazy: true, empty-fallback: REJECT}

# ── 3. 机场订阅 provider 模板 ──
# health-check 单次失败即标记 alive=false；filter 排除订阅中的提示信息
PProviders: &PProviders {type: http, interval: 86400, health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', expected-status: 204, interval: 60, lazy: false}, filter: '^(?!.*(拒绝|直连|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|traffic))'}

# ── 4. 规则提供者基础（mrs 格式，24h 更新） ──
Ruleset_Domain_Base: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
Ruleset_IP_Base: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}

# ── 5. 节点名筛选：地区 ──
region_hk: &region_hk "(?i)(香港|港|🇭🇰|\\bHK\\b|Hong ?Kong)"
region_sg: &region_sg "(?i)(新加坡|狮城|🇸🇬|\\bSG\\b|Singapore)"
region_jp: &region_jp "(?i)(日本|🇯🇵|\\bJP\\b|Japan)"
region_us: &region_us "(?i)(美国|🇺🇸|🇺🇲|\\bUS\\b|\\bUSA\\b|America|United States|UnitedStates|Los Angeles|Chicago|Ashburn|Seattle|Kansas)"
region_tw: &region_tw "(?i)(台湾|臺灣|台|臺|🇹🇼|\\bTW\\b|Taiwan)"
region_eu: &region_eu "(?i)(🇦🇱|🇦🇩|🇦🇹|🇧🇾|🇧🇪|🇧🇦|🇧🇬|🇭🇷|🇨🇾|🇨🇿|🇩🇰|🇪🇪|🇫🇮|🇫🇷|🇩🇪|🇬🇷|🇭🇺|🇮🇸|🇮🇪|🇮🇹|🇽🇰|🇱🇻|🇱🇮|🇱🇹|🇱🇺|🇲🇹|🇲🇩|🇲🇨|🇲🇪|🇳🇱|🇲🇰|🇳🇴|🇵🇱|🇵🇹|🇷🇴|🇷🇺|🇸🇲|🇷🇸|🇸🇰|🇸🇮|🇪🇸|🇸🇪|🇨🇭|🇹🇷|🇺🇦|🇬🇧|🇻🇦)"

# ── 6. 节点名筛选：特殊用途 ──
# 自建/家宽节点
home_only: &home_only "(?i)(自建|CF|The_house|private|home|家宽|Self_Back|hgc|HKT|HKBN|icable|Hinet|\\bATT\\b)"
# 低倍率(0<倍率≤0.5)+MITM(限港日新)，用于 Emby 等流媒体；倍率必须带 x/倍且有数字边界
lowrate_mitm: &lowrate_mitm "(?i)(?:(?:香港|港|🇭🇰|\\bHK\\b|Hong ?Kong|日本|🇯🇵|\\bJP\\b|Japan|新加坡|狮城|🇸🇬|\\bSG\\b|Singapore).*(?:(?<![0-9.])0\\.(?=[0-9]*[1-9])(?:[0-4][0-9]*|50*)(?:倍|x)(?![0-9A-Za-z.])|MITM|pornhub)|(?:(?<![0-9.])0\\.(?=[0-9]*[1-9])(?:[0-4][0-9]*|50*)(?:倍|x)(?![0-9A-Za-z.])|MITM|pornhub).*(?:香港|港|🇭🇰|\\bHK\\b|Hong ?Kong|日本|🇯🇵|\\bJP\\b|Japan|新加坡|狮城|🇸🇬|\\bSG\\b|Singapore))"
# 排除极低(≤0.3x)+极高(≥5x)+BETA，用于 url-test/load-balance
exclude_lowrate: &exclude_lowrate "(?i)(BETA|wcloud|\\btraffic\\b|(?<![0-9.])(?:0\\.(?=[0-9]*[1-9])(?:[0-2][0-9]*|30*)|(?:[5-9]|[1-9][0-9]+)(?:\\.[0-9]+)?)(?:倍|x)(?![0-9A-Za-z.]))"

# ── 7. 集合复用 ──
use_ap_all: &use_ap_all [Airport_01, Airport_02, Airport_03, Airport_04]

# ===== 以下为 mihomo 配置 =====

##############################################
# 机场订阅，Airport_01/02/03/04名称不能重复,但可修改为自己喜欢的
# 订阅链接 1/2/3/4是用来写订阅链接的，填入即可
# 机场名称 1/2/3/4是用来给节点添加备注的，不用记得整行删除
proxy-providers:
  Airport_01:
    <<: *PProviders
    proxy: "🟢 直连"
    url: "订阅链接1"
    override:
      additional-prefix: '[机场名称1]'
      skip-cert-verify: true
      udp: true
  Airport_02:
    <<: *PProviders
    proxy: "🟢 直连"
    url: "订阅链接2"
    override:
      additional-prefix: '[机场名称2]'
      skip-cert-verify: true
      udp: true
  Airport_03:
    <<: *PProviders
    proxy: "🟢 直连"
    url: "订阅链接3"
    override:
      additional-prefix: '[机场名称3]'
      skip-cert-verify: true
      udp: true
  Airport_04:
    <<: *PProviders
    proxy: "🟢 直连"
    url: "订阅链接4"
    override:
      additional-prefix: '[机场名称4]'
      skip-cert-verify: true
      udp: true

##############################################
# 用于下载订阅时指定UA
global-ua: clash.meta

# 全局配置
mixed-port: 7890
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true
# interface-name: eth0  （路由器下根据情况指定出站接口）
authentication: []
skip-auth-prefixes:
- 127.0.0.1/8
- ::1/128

# 控制面板(警告：开启后请务必设置密码以防他人控制，按需关闭外部访问)
external-controller: 0.0.0.0:9090
secret: "7a13b88333760a18574d3b32" # 7a13b88333760a18574d3b32
#  密码设置选项默认无
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"
# 下载面板地址可更换：https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip

# 匹配进程 always/strict/off（rules 中无 PROCESS-NAME 规则，关闭以节省每连接系统调用）
find-process-mode: "off"
# global-client-fingerprint:  # 已弃用，如需TLS指纹伪装请在代理节点上单独设置
# TCP keep-alive（移动网络 NAT 超时偏短，60s 探测可覆盖 98% NAT 场景）
keep-alive-idle: 60
keep-alive-interval: 30

# 策略组选择和fakeip缓存
profile:
  store-selected: true
  store-fake-ip: true

# 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080, 8888]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    # 米家会把非 DNS 主机名写入握手，必须在嗅探层忽略
    - "Mijia Cloud"
    - "+.io.mi.com"
    - "+.apple.com"
    - "+.wechat.com"
    - "+.qpic.cn"
    - "+.qq.com"
    - "+.wechatapp.com"
    - "+.vivox.com"
    # 向日葵服务
    - "+.oray.com"
    - "+.sunlogin.net"

# 代理模式
tun:
  enable: true
  stack: system
  device: tun0
  mtu: 9000
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  strict-route: true
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  #include-interface:
  #  - br-lan2

# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  # 只读取 hosts 文件，不调用宿主系统 DNS
  use-system-hosts: true
  prefer-h3: false # 是否开启 DoH 支持 HTTP/3，将并发尝试
  respect-rules: true
  # 模式切换 redir-host / fake-ip
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/15
  # 使用窄 ULA /64，避免与局域网常见的 fc00::/7 地址空间大面积碰撞
  fake-ip-range6: fdfe:dcba:9876::/64
  # 模式切换 blacklist/whitelist/rule
  # rule 模式使用 rules 语法；匹配 real-ip 时不返回 Fake-IP，未命中则继续返回 Fake-IP
  fake-ip-filter-mode: rule
  fake-ip-filter:
    # 1. 私有域统一由一个来源维护；DNS 策略决定其最终解析结果
    - "RULE-SET,private_domain,real-ip"

    # 2. STUN 穿透服务（精确规则集，避免关键词 turn 误伤 return/saturn 等正常域名）
    - "RULE-SET,stun_domain,real-ip"

    # 3. 系统探测与时间同步 (确保开机和连网时的基础网络正常)
    - "DOMAIN-SUFFIX,msftconnecttest.com,real-ip"
    - "DOMAIN-SUFFIX,msftncsi.com,real-ip"
    - "DOMAIN-SUFFIX,pool.ntp.org,real-ip"
    - "DOMAIN-SUFFIX,time.windows.com,real-ip"
    - "DOMAIN-SUFFIX,time.apple.com,real-ip"
    - "DOMAIN-SUFFIX,ntp.org.cn,real-ip"

    # 4. 自定义直连规则同步排除 Fake-IP (明确指定的域名，优先级最高)
    - "DOMAIN-SUFFIX,kuapt.top,real-ip"
    - "DOMAIN-SUFFIX,catxxp123.top,real-ip"
    - "DOMAIN-SUFFIX,c4lm0n.top,real-ip"
    - "DOMAIN-SUFFIX,maj-soul.com,real-ip"
    - "DOMAIN-SUFFIX,catmajsoul.com,real-ip"
    - "DOMAIN-SUFFIX,catmjstudio.com,real-ip"
    - "DOMAIN-SUFFIX,homdgcat.wiki,real-ip"
    - "DOMAIN-SUFFIX,bsbsb.top,real-ip"
    - "DOMAIN-SUFFIX,3ct.2ndtool.top,real-ip"
    - "DOMAIN-SUFFIX,kejiweixun.com,real-ip"
    - "DOMAIN-SUFFIX,yunmu.xiercloud.uk,real-ip"
    - "DOMAIN-SUFFIX,argotunnel.com,real-ip"
    - "DOMAIN-SUFFIX,cftunnel.com,real-ip"
    - "DOMAIN-SUFFIX,trycloudflare.com,real-ip"

    # 5. 专属 Fake-IP 过滤规则集与直连规则集
    - "RULE-SET,fakeip_filter_domain,real-ip"
    - "RULE-SET,direct_domain,real-ip"

    # 6. 特殊服务、主机游戏与 P2P (对 Fake-IP 敏感)
    - "DOMAIN-SUFFIX,srv.nintendo.net,real-ip"
    - "DOMAIN-SUFFIX,stun.playstation.net,real-ip"
    - "DOMAIN-SUFFIX,xboxlive.com,real-ip"
    - "DOMAIN-SUFFIX,xbox.microsoft.com,real-ip"
    - "DOMAIN-SUFFIX,sandai.net,real-ip"
    - "DOMAIN-SUFFIX,n0808.com,real-ip"
    - "DOMAIN-SUFFIX,mcdn.bilivideo.cn,real-ip"
    - "DOMAIN-SUFFIX,proxy.golang.org,real-ip"
    - "RULE-SET,game_cn_domain,real-ip"
    - "RULE-SET,steam_cn_domain,real-ip"
    - "RULE-SET,pt_cn_domain,real-ip"
    - "RULE-SET,public-tracker_domain,real-ip"
    - "RULE-SET,115_domain,real-ip"

    # 7. 常见国内服务规则集 (中频，服务类)
    - "RULE-SET,wechat_domain,real-ip"
    - "RULE-SET,bank_cn_domain,real-ip"
    - "RULE-SET,alibaba_domain,real-ip"
    - "RULE-SET,xiaomi_domain,real-ip"
    - "RULE-SET,apple_cn_domain,real-ip"
    - "RULE-SET,apple_update_domain,real-ip"
    - "RULE-SET,aliyun_domain,real-ip"
    - "RULE-SET,ai_cn_domain,real-ip"

    # 8. 国内媒体与大规则集 (词库极其庞大，放最后以提升整体匹配性能)
    - "RULE-SET,NetEaseMusic_domain,real-ip"
    - "RULE-SET,media_cn_domain,real-ip"
    - "RULE-SET,iptv_domain,real-ip"
    - "RULE-SET,cn_domain,real-ip"

    # 显式兜底（未命中以上规则的域名继续返回 Fake-IP）
    - "MATCH,fake-ip"
  default-nameserver:
    # 仅用于引导域名型 DoH；使用 IP 字面量 DoH，避免任何外部 53 端口被劫持回本机
    - https://223.5.5.5/dns-query
    - https://1.1.1.1/dns-query
  proxy-server-nameserver:
    - "https://dns.alidns.com/dns-query#🟢 直连"
    - "https://doh.pub/dns-query#🟢 直连"
  direct-nameserver:
    - "https://dns.alidns.com/dns-query#🟢 直连"
    - "https://doh.pub/dns-query#🟢 直连"
  # 本地域应由 Mihomo 上游的 MosDNS/本地 DNS 截获；若意外漏入此处则统一返回 NXDOMAIN。
  # 不猜测局域网 DNS 地址、不回退 system/DHCP；Plex 因使用公开权威 DNS 单独放行。
  nameserver-policy:
    "+.plex.direct":
      - "https://dns.alidns.com/dns-query#🟢 直连"
      - "https://doh.pub/dns-query#🟢 直连"
    "rule-set:private_domain": "rcode://name_error"
    "rule-set:cn_domain":
      - "https://dns.alidns.com/dns-query#🟢 直连"
      - "https://doh.pub/dns-query#🟢 直连"
  # 直连目标也必须遵守 private/CN 策略，不能绕回默认解析器
  direct-nameserver-follow-policy: true
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query

proxies:
  - name: "🟢 直连"
    type: direct
    udp: true
