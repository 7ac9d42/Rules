# ===== 锚点定义区 =====
# 解析兼容下限为 Mihomo v1.19.19；此前版本不支持 fake-ip-filter-mode: rule。
# empty-fallback 在 v1.19.27 前会被忽略；完整拒绝语义及推荐运行版本为 v1.19.27+。

# ── 1. 服务策略组通用 proxies 列表 ──
# 机场名称1优先：质量敏感业务使用机场名称1→机场名称3→机场名称4主链
Airport1_first: &Airport1_first {type: select, proxies: [机场名称1优先, 机场名称3优先, 自建/家宽节点, 香港节点, 日本节点, 新加坡节点, 台湾节点, 美国节点, 欧洲节点, DIRECT, 全部节点]}
# 机场名称3优先：成本敏感业务使用机场名称3→机场名称1→机场名称4主链；不提供直连候选
Airport3_first: &Airport3_first {type: select, proxies: [机场名称3优先, 机场名称1优先, 自建/家宽节点, 香港节点, 日本节点, 新加坡节点, 台湾节点, 美国节点, 欧洲节点, 全部节点]}
# 直连优先（Apple/B站等国内 CDN 服务）
Direct_first: &Direct_first {type: select, proxies: [DIRECT, 节点选择, 自建/家宽节点, 香港节点, 日本节点, 新加坡节点, 台湾节点, 美国节点, 欧洲节点, 全部节点]}

# ── 2. 策略组类型基础参数 ──
# use 组继承 provider 的测试地址与健康状态；组级失败计数仍可触发 provider 强检
Urltest_Base: &Urltest_Base {type: url-test, timeout: 3000, tolerance: 50, max-failed-times: 2, empty-fallback: REJECT, expected-status: 204, hidden: true}
# 下层与辅助 fallback 按需复检；空组拒绝连接，多次连接失败后强制复测
Fallback_Base: &Fallback_Base {type: fallback, url: "https://www.gstatic.com/generate_204", expected-status: 204, timeout: 3000, interval: 60, max-failed-times: 3, lazy: true, empty-fallback: REJECT}
# 机场名称3主链作为唯一常驻心跳，每 45 秒递归刷新三机场路径并在两次连接失败后强检
Fallback_Heartbeat_Base: &Fallback_Heartbeat_Base {<<: *Fallback_Base, interval: 45, max-failed-times: 2, lazy: false}
# load-balance 同域名走同节点；use 节点继续复用 provider 的健康状态
Loadbalance_Base: &Loadbalance_Base {type: load-balance, strategy: consistent-hashing, timeout: 3000, expected-status: 204, max-failed-times: 3, empty-fallback: REJECT}

# ── 3. 机场订阅 provider 模板 ──
# 180 秒全量刷新叶节点；真实业务失败仍会绕过周期触发强检
PProviders: &PProviders {type: http, interval: 86400, health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', expected-status: 204, timeout: 3000, interval: 180, lazy: false}, exclude-filter: '(?i)(剩余流量|流量剩余|已用流量|总流量|套餐流量|套餐到期|到期时间|下次重置|重置时间|订阅到期|官方公告|使用教程|Panel[ _-]*Notice|^Expired$|(?:^|[\s\[【(（_|｜丨-])(?:Traffic|Remaining|Quota|Used|Total|Expire(?:d|s)?)\s*[:：]\s*(?:[0-9]|∞|Unlimited)|(?:^|[\s\[【(（_|｜丨-])Email\s*[:：]\s*\S+@|(?:^|[\s\[【(（_|｜丨-])Panel\s*[:：]|(?:^|[\s\[【(（_|｜丨-])(?:官网|客服|工单|邮箱)(?:地址|链接|入口)?(?:$|[\s\]】)）|｜丨:：_-]))'}

# ── 4. 规则提供者基础（24h 更新） ──
Ruleset_Domain_Base: &domain {type: http, interval: 86400, behavior: domain, format: mrs, proxy: 规则更新}
Ruleset_IP_Base: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs, proxy: 规则更新}
Ruleset_Classical_Base: &classical {type: http, interval: 86400, behavior: classical, format: text, proxy: 规则更新}

# ── 5. 节点名筛选：地区 ──
region_hk: &region_hk "(?i)(香港|港|🇭🇰|\\bHK\\b|Hong ?Kong)"
# 机场名称1 HongKong 02-05 纵向成功率仅 10%-19%；只退出自动组，地区手选仍保留原始节点
region_hk_stable_auto: &region_hk_stable_auto "(?i)^(?!.*Hong ?Kong 0[2-5](?:\\D|$)).*(香港|港|🇭🇰|\\bHK\\b|Hong ?Kong)"
region_sg: &region_sg "(?i)(新加坡|狮城|🇸🇬|\\bSG\\b|Singapore)"
region_jp: &region_jp "(?i)(日本|🇯🇵|\\bJP\\b|Japan)"
# 机场名称3 的日新纯 CTCU 在路由器出口持续波动；仅从这两个自动组排除，不误伤 CTCUCM
region_sg_no_ctcu: &region_sg_no_ctcu "(?i)^(?!CTCU(?:\\||$))(?!.*\\|CTCU(?:\\||$)).*(新加坡|狮城|🇸🇬|\\bSG\\b|Singapore)"
region_jp_no_ctcu: &region_jp_no_ctcu "(?i)^(?!CTCU(?:\\||$))(?!.*\\|CTCU(?:\\||$)).*(日本|🇯🇵|\\bJP\\b|Japan)"
region_us: &region_us "(?i)(美国|🇺🇸|🇺🇲|\\bUS\\b|\\bUSA\\b|America|United States|UnitedStates|Los Angeles|Chicago|Ashburn|Seattle|Kansas)"
region_tw: &region_tw "(?i)(台湾|台灣|臺灣|🇹🇼|\\bTW\\b|\\bTWN\\b|Taiwan|Taipei|New ?Taipei|台北|臺北|新北|\\bTPE\\b|Taichung|台中|臺中|\\bRMQ\\b|Tainan|台南|臺南|\\bTNN\\b|Kaohsiung|高雄|\\bKHH\\b)"
region_eu: &region_eu "(?i)(🇦🇱|🇦🇩|🇦🇹|🇧🇾|🇧🇪|🇧🇦|🇧🇬|🇭🇷|🇨🇾|🇨🇿|🇩🇰|🇪🇪|🇫🇮|🇫🇷|🇩🇪|🇬🇷|🇭🇺|🇮🇸|🇮🇪|🇮🇹|🇽🇰|🇱🇻|🇱🇮|🇱🇹|🇱🇺|🇲🇹|🇲🇩|🇲🇨|🇲🇪|🇳🇱|🇲🇰|🇳🇴|🇵🇱|🇵🇹|🇷🇴|🇷🇺|🇸🇲|🇷🇸|🇸🇰|🇸🇮|🇪🇸|🇸🇪|🇨🇭|🇹🇷|🇺🇦|🇬🇧|🇻🇦|欧洲|歐洲|欧盟|歐盟|英国|英國|德国|德國|法国|法國|荷兰|荷蘭|瑞士|瑞典|挪威|芬兰|芬蘭|丹麦|丹麥|意大利|義大利|西班牙|葡萄牙|波兰|波蘭|奥地利|奧地利|爱尔兰|愛爾蘭|比利时|比利時|\\b(?:United ?Kingdom|Britain|England|London|Germany|Frankfurt|Berlin|Munich|France|Paris|Netherlands|Amsterdam|Switzerland|Zurich|Sweden|Stockholm|Norway|Oslo|Finland|Helsinki|Denmark|Copenhagen|Italy|Milan|Rome|Spain|Madrid|Portugal|Lisbon|Poland|Warsaw|Austria|Vienna|Ireland|Dublin|Belgium|Brussels|Romania|Bucharest|Czech(?:ia| Republic)?|Prague|Hungary|Budapest|Greece|Athens|Iceland|Luxembourg|Russia|Moscow|Turkey|Istanbul|Ukraine|Kyiv|Kiev|UK|GB|DE|FR|NL|CH|SE|NO|FI|DK|IT|ES|PT|PL|AT|IE|BE|RO|CZ|HU|GR|IS|LU|RU|TR|UA)\\b)"

# ── 6. 节点名筛选：特殊用途 ──
# 自建/家宽节点
home_only: &home_only "(?i)(自建|CF|The_house|private|home|家宽|Self_Back|hgc|HKT|HKBN|icable|Hinet|\\bATT\\b)"
# 低倍率(0<倍率≤0.5)+MITM(限港日新)，用于 Emby 等流媒体；倍率必须带 x/倍且有数字边界
lowrate_mitm: &lowrate_mitm "(?i)(?:(?:香港|港|🇭🇰|\\bHK\\b|Hong ?Kong|日本|🇯🇵|\\bJP\\b|Japan|新加坡|狮城|🇸🇬|\\bSG\\b|Singapore).*(?:(?<![0-9.])0\\.(?=[0-9]*[1-9])(?:[0-4][0-9]*|50*)(?:倍|x)(?![0-9A-Za-z.])|MITM|pornhub)|(?:(?<![0-9.])0\\.(?=[0-9]*[1-9])(?:[0-4][0-9]*|50*)(?:倍|x)(?![0-9A-Za-z.])|MITM|pornhub).*(?:香港|港|🇭🇰|\\bHK\\b|Hong ?Kong|日本|🇯🇵|\\bJP\\b|Japan|新加坡|狮城|🇸🇬|\\bSG\\b|Singapore))"
# 排除极低(≤0.3x)+极高(≥5x)+BETA，用于 url-test/load-balance
exclude_lowrate: &exclude_lowrate "(?i)(BETA|wcloud|\\btraffic\\b|(?<![0-9.])(?:0\\.(?=[0-9]*[1-9])(?:[0-2][0-9]*|30*)|(?:[5-9]|[1-9][0-9]+)(?:\\.[0-9]+)?)(?:倍|x)(?![0-9A-Za-z.]))"

# ── 7. 集合复用 ──
# 四机场模板：普通自动与均衡不使用仅作兜底的 Airport_04
#use_ap_primary: &use_ap_primary [Airport_01, Airport_02, Airport_03]
# 当前启用的普通机场：1、3
use_ap_primary: &use_ap_primary [Airport_01, Airport_03]
# 四机场模板：启用 Airport_02 时用下一行替换当前三机场定义
#use_ap_all: &use_ap_all [Airport_01, Airport_02, Airport_03, Airport_04]
# 当前启用机场：1、3、4
use_ap_all: &use_ap_all [Airport_01, Airport_03, Airport_04]

# ===== 以下为 mihomo 配置 =====

##############################################
# provider 键名 Airport_01/02/03/04 固定；验证器和恢复模板依赖这些名称。
# 只修改订阅 url 与 additional-prefix 显示前缀，各机场前缀必须非空且互不重复。
proxy-providers:
  Airport_01:
    <<: *PProviders
    proxy: DIRECT
    url: "订阅链接1"
    override:
      additional-prefix: '[机场名称1]'
      skip-cert-verify: true
      udp: true
# Airport_02 暂时禁用，但其模板必须与现行结构同步维护。
# 启用时必须成套完成；标为“四机场模板”的行要替换当前同名行，不能同时取消注释：
# 仅对模板代码行删除最前面的 `#`，保留其后的空格与 YAML 层级。
# 1. 启用 Airport_02 provider，并将 use_ap_primary、use_ap_all 换为四机场模板。
# 2. 启用机场名称2的五个地区 url-test 与“机场名称2地区优先”。
# 3. 将普通多机场、同地区跨机场、地区节点组换为对应四机场模板。
# 4. 将“机场名称3优先”换为机场名称3→机场名称1→机场名称2→机场名称4模板；“规则更新”另保留末位直连。
# 5. 完整校验会在检测到 Airport_02 后检查 provider 字段，并要求以上链路全部包含机场名称2。
#  Airport_02:
#    <<: *PProviders
#    proxy: DIRECT
#    url: "订阅链接2"
#    override:
#      additional-prefix: '[机场名称2]'
#      skip-cert-verify: true
#      udp: true
  Airport_03:
    <<: *PProviders
    proxy: DIRECT
    url: "订阅链接3"
    override:
      additional-prefix: '[机场名称3]'
      skip-cert-verify: true
      udp: true
  Airport_04:
    <<: *PProviders
    proxy: DIRECT
    url: "订阅链接4"
    override:
      additional-prefix: '[机场名称4]'
      skip-cert-verify: true
      udp: true

##############################################
# 用于下载订阅时指定UA
global-ua: clash.meta

# 全局配置
mode: rule
mixed-port: 7890
ipv6: false
allow-lan: true
unified-delay: true
tcp-concurrent: true
# interface-name: eth0  （路由器下根据情况指定出站接口）
authentication: []
skip-auth-prefixes:
- 127.0.0.1/8
- ::1/128

# 控制面板(警告：开启后请务必设置密码以防他人控制，按需关闭外部访问)
external-controller: 0.0.0.0:9090
secret: "7a13b88333760a18574d3b32" # 7a13b88333760a18574d3b32
#  密码设置选项默认无
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"
# 下载面板地址可更换：https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip

# 匹配进程 always/strict/off（rules 中无 PROCESS-NAME 规则，关闭以节省每连接系统调用）
find-process-mode: "off"
# global-client-fingerprint:  # 已弃用，如需TLS指纹伪装请在代理节点上单独设置

# 策略组选择和fakeip缓存
profile:
  store-selected: false
  store-fake-ip: true

# 流量嗅探
sniffer:
  enable: true
  # 显式固定关键语义，避免依赖 Mihomo 默认值
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080, 8888]
      override-destination: true
    TLS:
      ports: [443, 8443, 5228-5230]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    # 米家会把非 DNS 主机名写入握手，必须在嗅探层忽略
    - "Mijia Cloud"
    - "+.io.mi.com"
    - "+.apple.com"
    - "+.wechat.com"
    - "+.qpic.cn"
    - "+.qq.com"
    - "+.wechatapp.com"
    - "+.vivox.com"
    # 向日葵服务
    - "+.oray.com"
    - "+.sunlogin.net"

# 代理模式
tun:
  enable: true
  stack: system
  device: tun0
  mtu: 9000
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  strict-route: true
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  #include-interface:
  #  - br-lan2

# DNS模块
dns:
  enable: true
  # Android 私人 DNS 使用 DoT，不会进入此监听；需要完整接管时应在系统中关闭
  listen: 0.0.0.0:1053
  ipv6: false
  # 只读取 hosts 文件，不调用宿主系统 DNS
  use-system-hosts: true
  prefer-h3: false # 是否开启 DoH 支持 HTTP/3，将并发尝试
  respect-rules: true
  # LRU 会保留过期项并异步刷新，降低移动网络切换时的解析抖动
  cache-algorithm: lru
  # 模式切换 redir-host / fake-ip
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/15
  # 使用窄 ULA /64，避免与局域网常见的 fc00::/7 地址空间大面积碰撞
  fake-ip-range6: fdfe:dcba:9876::/64
  # 模式切换 blacklist/whitelist/rule
  # rule 模式使用 rules 语法；匹配 real-ip 时不返回 Fake-IP，未命中则继续返回 Fake-IP
  fake-ip-filter-mode: rule
  fake-ip-filter:
    # 1. 私有域统一由一个来源维护；DNS 策略决定其最终解析结果
    - "RULE-SET,private_domain,real-ip"

    # 2. STUN 穿透服务（精确规则集，避免关键词 turn 误伤 return/saturn 等正常域名）
    - "RULE-SET,stun_domain,real-ip"

    # 3. 系统探测与时间同步 (确保开机和连网时的基础网络正常)
    - "DOMAIN,connectivitycheck.gstatic.com,real-ip"
    - "DOMAIN-SUFFIX,msftconnecttest.com,real-ip"
    - "DOMAIN-SUFFIX,msftncsi.com,real-ip"
    - "DOMAIN-SUFFIX,pool.ntp.org,real-ip"
    - "DOMAIN-SUFFIX,time.windows.com,real-ip"
    - "DOMAIN-SUFFIX,time.apple.com,real-ip"
    - "DOMAIN-SUFFIX,ntp.org.cn,real-ip"

    # 4. 专属 Fake-IP 过滤规则集（集合内容混合，不绑定固定解析器）
    - "RULE-SET,fakeip_filter_domain,real-ip"

    # 5. 特殊服务、主机游戏与 P2P (对 Fake-IP 敏感)
    - "DOMAIN-SUFFIX,srv.nintendo.net,real-ip"
    - "DOMAIN-SUFFIX,stun.playstation.net,real-ip"
    - "DOMAIN-SUFFIX,xboxlive.com,real-ip"
    - "DOMAIN-SUFFIX,xbox.microsoft.com,real-ip"
    - "DOMAIN-SUFFIX,sandai.net,real-ip"
    - "DOMAIN-SUFFIX,n0808.com,real-ip"
    - "DOMAIN-SUFFIX,mcdn.bilivideo.cn,real-ip"
    - "DOMAIN-SUFFIX,proxy.golang.org,real-ip"
    - "DOMAIN-SUFFIX,steamserver.net,real-ip"
    - "RULE-SET,game_cn_domain,real-ip"
    - "RULE-SET,steam_cn_domain,real-ip"
    - "RULE-SET,pt_domain,real-ip"
    - "RULE-SET,public-tracker_domain,real-ip"
    - "RULE-SET,115_domain,real-ip"

    # 6. 常见国内服务规则集 (中频，服务类)
    - "RULE-SET,wechat_domain,real-ip"
    - "RULE-SET,bank_cn_domain,real-ip"
    - "RULE-SET,alibaba_domain,real-ip"
    - "RULE-SET,xiaomi_domain,real-ip"
    - "RULE-SET,apple_cn_domain,real-ip"
    - "RULE-SET,ai_cn_domain,real-ip"

    # 7. 国内媒体与大规则集 (词库极其庞大，放最后以提升整体匹配性能)
    - "RULE-SET,NetEaseMusic_domain,real-ip"
    - "RULE-SET,media_cn_domain,real-ip"
    - "RULE-SET,iptv_domain,real-ip"
    - "RULE-SET,cn_domain,real-ip"

    # 显式兜底（未命中以上规则的域名继续返回 Fake-IP）
    - "MATCH,fake-ip"
  default-nameserver:
    # 仅用于引导域名型 DoH；使用 IP 字面量 DoH，避免任何外部 53 端口被劫持回本机
    - https://223.5.5.5/dns-query
    - https://1.1.1.1/dns-query
  proxy-server-nameserver:
    - "https://dns.alidns.com/dns-query#DIRECT"
    - "https://doh.pub/dns-query#DIRECT"
  direct-nameserver:
    - "https://dns.alidns.com/dns-query#DIRECT"
    - "https://doh.pub/dns-query#DIRECT"
  # 本地域应由 Mihomo 上游的 MosDNS/本地 DNS 截获；若意外漏入此处则统一返回 NXDOMAIN。
  # 不猜测局域网 DNS 地址、不回退 system/DHCP；Plex 因使用公开权威 DNS 单独放行。
  nameserver-policy:
    "+.plex.direct":
      - "https://dns.alidns.com/dns-query#DIRECT"
      - "https://doh.pub/dns-query#DIRECT"
    "rule-set:private_domain": "rcode://name_error"
    "rule-set:cn_domain":
      - "https://dns.alidns.com/dns-query#DIRECT"
      - "https://doh.pub/dns-query#DIRECT"
    # 返回 Real-IP 且固定直连的规则集，必须在初次查询时显式使用国内解析器。
    "rule-set:game_cn_domain,steam_cn_domain,pt_domain,public-tracker_domain,115_domain":
      - "https://dns.alidns.com/dns-query#DIRECT"
      - "https://doh.pub/dns-query#DIRECT"
    "rule-set:wechat_domain,bank_cn_domain,alibaba_domain,xiaomi_domain,apple_cn_domain,ai_cn_domain":
      - "https://dns.alidns.com/dns-query#DIRECT"
      - "https://doh.pub/dns-query#DIRECT"
    "rule-set:NetEaseMusic_domain,media_cn_domain,iptv_domain":
      - "https://dns.alidns.com/dns-query#DIRECT"
      - "https://doh.pub/dns-query#DIRECT"
  # 直连目标也必须遵守以上显式策略，不能绕回默认解析器
  direct-nameserver-follow-policy: true
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query

# 策略组
proxy-groups:
