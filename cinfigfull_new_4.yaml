rules:
  # 自定义优先规则
  # 仅附件与源码归档走纯下载；网页、API、Git 连接及上传保留业务选路。
  - RULE-SET,pure_download_domain,纯下载
  # OpenCode Zen/Go 共用主域，统一走 AI。
  - DOMAIN-SUFFIX,opencode.ai,AI
  # Copilot API 精确补充，勿扩大到整个 GitHub。
  - DOMAIN,origin-tracker.githubusercontent.com,AI
  # Copilot 专属附件先于通用 Azure Blob 下载后缀。
  - DOMAIN,copilotprodattachments.blob.core.windows.net,AI
  # 手选节点不支持 UDP 时拒绝，保持 AI 出口边界。
  - AND,((NETWORK,udp),(OR,((DOMAIN-SUFFIX,opencode.ai),(DOMAIN,origin-tracker.githubusercontent.com),(DOMAIN,copilotprodattachments.blob.core.windows.net)))),REJECT
  # 香港电视例外须先于小米父域直连。
  - DOMAIN,hk.tv.global.mi.com,通用代理
  - DOMAIN,ykk.emby.moe,Emby
  - IP-CIDR,189.24.106.132/32,DIRECT,no-resolve
  - DOMAIN-SUFFIX,kuapt.top,DIRECT
  - DOMAIN-SUFFIX,catxxp123.top,DIRECT
  - DOMAIN-SUFFIX,c4lm0n.top,DIRECT
  - DOMAIN-SUFFIX,maj-soul.com,DIRECT
  - DOMAIN-SUFFIX,catmajsoul.com,DIRECT
  - DOMAIN-SUFFIX,catmjstudio.com,DIRECT
  - DOMAIN-SUFFIX,homdgcat.wiki,DIRECT
  - DOMAIN-SUFFIX,bsbsb.top,DIRECT
  - DOMAIN-SUFFIX,3ct.2ndtool.top,DIRECT
  - DOMAIN-SUFFIX,yunmu.xiercloud.uk,DIRECT
  - AND,((DST-PORT,7844),(OR,((DOMAIN,region1.v2.argotunnel.com),(DOMAIN,region2.v2.argotunnel.com),(DOMAIN,cftunnel.com),(DOMAIN,h2.cftunnel.com),(DOMAIN,quic.cftunnel.com)))),Cloudflare Tunnel
  - AND,((DST-PORT,7844),(RULE-SET,cloudflare_tunnel_ip,no-resolve)),Cloudflare Tunnel
  # 不支持 UDP 的手选节点应拒绝，避免继续下落成直连或其他出口。
  - AND,((DST-PORT,7844),(OR,((DOMAIN,region1.v2.argotunnel.com),(DOMAIN,region2.v2.argotunnel.com),(DOMAIN,cftunnel.com),(DOMAIN,h2.cftunnel.com),(DOMAIN,quic.cftunnel.com)))),REJECT
  - AND,((DST-PORT,7844),(RULE-SET,cloudflare_tunnel_ip,no-resolve)),REJECT
  - DOMAIN-SUFFIX,argotunnel.com,DIRECT
  - DOMAIN-SUFFIX,cftunnel.com,DIRECT
  - DOMAIN-SUFFIX,trycloudflare.com,DIRECT
  # 金融例外先于广告
  - RULE-SET,Wise_domain,金融
  - RULE-SET,paypal_domain,金融

  # 高置信广告与 PCDN 先于国内父域
  - RULE-SET,banAd_core_domain,隐私拦截
  - RULE-SET,banAd_core_classical,隐私拦截

  - RULE-SET,banAd_pcdn_domain,隐私拦截
  - RULE-SET,banAd_pcdn_classical,隐私拦截

  # 国内大集合中的具体业务
  - RULE-SET,appleTV_domain,境外影音
  - RULE-SET,apple_update_domain,Apple
  - DOMAIN-SUFFIX,mytv.com.hk,TVB
  - RULE-SET,TVB_domain,TVB

  # 国内白名单：core/PCDN 之后、low 之前
  - RULE-SET,wechat_domain,DIRECT
  - RULE-SET,bank_cn_domain,DIRECT
  - RULE-SET,alibaba_domain,DIRECT
  - RULE-SET,115_domain,DIRECT
  - RULE-SET,ifast_domain,DIRECT
  - RULE-SET,ai_cn_domain,DIRECT
  - RULE-SET,direct_domain,DIRECT
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,iptv_domain,DIRECT
  - RULE-SET,xiaomi_domain,DIRECT
  - RULE-SET,apple_cn_domain,DIRECT
  - RULE-SET,steam_cn_domain,DIRECT
  - RULE-SET,game_cn_domain,DIRECT
  - RULE-SET,steamcdn_domain,DIRECT
  - RULE-SET,NetEaseMusic_domain,DIRECT
  - RULE-SET,pt_domain,DIRECT
  - RULE-SET,public-tracker_domain,DIRECT
  - RULE-SET,media_cn_domain,DIRECT

  # 其余拦截（白名单优先）
  - RULE-SET,banAd_low_domain,隐私拦截

  # 跨区业务先于国内总集合
  - RULE-SET,apple_domain,Apple
  - RULE-SET,biliintl_domain,哔哩东南亚
  - RULE-SET,bilibili_domain,哔哩哔哩

  # 开发产品
  - DOMAIN-SUFFIX,huggingface.co,开发下载
  - DOMAIN-SUFFIX,hf.co,开发下载
  # Docker 仅含拉取、安装与更新，勿扩大到账号或其他产品。
  - DOMAIN-SUFFIX,docker.io,开发下载
  - DOMAIN,production.cloudfront.docker.com,开发下载
