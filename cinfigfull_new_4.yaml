# 订阅与规则基础参数
PProviders: &PProviders
  type: http
  interval: 86400
  health-check:
    enable: true
    url: *google_test_url
    expected-status: 204
    timeout: 3500
    interval: 60
    lazy: false
  exclude-filter: '(?i)(剩余流量|流量剩余|已用流量|总流量|套餐流量|套餐到期|到期时间|下次重置|重置时间|订阅到期|官方公告|使用教程|Panel[ _-]*Notice|^Expired$|(?:^|[\s\[【(（_|｜丨-])(?:Traffic|Remaining|Quota|Used|Total|Expire(?:d|s)?)\s*[:：]\s*(?:[0-9]|∞|Unlimited)|(?:^|[\s\[【(（_|｜丨-])Email\s*[:：]\s*\S+@|(?:^|[\s\[【(（_|｜丨-])Panel\s*[:：]|(?:^|[\s\[【(（_|｜丨-])(?:官网|客服|工单|邮箱)(?:地址|链接|入口)?(?:$|[\s\]】)）|｜丨:：_-]))'

Ruleset_Domain_Base: &domain
  type: http
  interval: 86400
  behavior: domain
  format: mrs
  proxy: 规则更新

Ruleset_IP_Base: &ip
  type: http
  interval: 86400
  behavior: ipcidr
  format: mrs
  proxy: 规则更新

Ruleset_Classical_Base: &classical
  type: http
  interval: 86400
  behavior: classical
  format: text
  proxy: 规则更新

# 地区筛选
region_hk: &region_hk "(?i)(香港|港|🇭🇰|\\bHK\\b|Hong ?Kong)"

# 香港不稳定编号仅退出自动候选。
region_hk_stable_auto: &region_hk_stable_auto "(?i)^(?!.*Hong ?Kong 0[2-5](?:\\D|$)).*(香港|港|🇭🇰|\\bHK\\b|Hong ?Kong)"
region_sg: &region_sg "(?i)(新加坡|狮城|🇸🇬|\\bSG\\b|Singapore)"
region_jp: &region_jp "(?i)(日本|🇯🇵|\\bJP\\b|Japan)"

# 机场名称3日新排除纯 CTCU，保留 CTCUCM。
region_sg_no_ctcu: &region_sg_no_ctcu "(?i)^(?!.*(?<![0-9A-Za-z])CTCU(?:\\||$)).*(新加坡|狮城|🇸🇬|\\bSG\\b|Singapore)"
region_jp_no_ctcu: &region_jp_no_ctcu "(?i)^(?!.*(?<![0-9A-Za-z])CTCU(?:\\||$)).*(日本|🇯🇵|\\bJP\\b|Japan)"
region_us: &region_us "(?i)(美国|🇺🇸|🇺🇲|\\bUS\\b|\\bUSA\\b|America|United States|UnitedStates|Los Angeles|Chicago|Ashburn|Seattle|Kansas)"
region_download: &region_download "(?i)(香港|港|🇭🇰|\\bHK\\b|Hong ?Kong|日本|🇯🇵|\\bJP\\b|Japan|新加坡|狮城|🇸🇬|\\bSG\\b|Singapore|美国|🇺🇸|🇺🇲|\\bUS\\b|\\bUSA\\b|America|United States|UnitedStates|Los Angeles|Chicago|Ashburn|Seattle|Kansas)"
region_tw: &region_tw "(?i)(台湾|台灣|臺灣|🇹🇼|\\bTW\\b|\\bTWN\\b|Taiwan|Taipei|New ?Taipei|台北|臺北|新北|\\bTPE\\b|Taichung|台中|臺中|\\bRMQ\\b|Tainan|台南|臺南|\\bTNN\\b|Kaohsiung|高雄|\\bKHH\\b)"

# 特殊用途与倍率筛选
home_only: &home_only "(?i)(自建|CF|The_house|private|home|家宽|Self_Back|hgc|HKT|HKBN|icable|Hinet|\\bATT\\b)"

# Emby：港日新 0<倍率≤0.5 或 MITM；倍率须带 x/倍及数字边界。
lowrate_mitm: &lowrate_mitm "(?i)(?:(?:香港|港|🇭🇰|\\bHK\\b|Hong ?Kong|日本|🇯🇵|\\bJP\\b|Japan|新加坡|狮城|🇸🇬|\\bSG\\b|Singapore).*(?:(?<![0-9.])0\\.(?=[0-9]*[1-9])(?:[0-4][0-9]*|50*)(?:倍|x)(?![0-9A-Za-z.])|MITM|pornhub)|(?:(?<![0-9.])0\\.(?=[0-9]*[1-9])(?:[0-4][0-9]*|50*)(?:倍|x)(?![0-9A-Za-z.])|MITM|pornhub).*(?:香港|港|🇭🇰|\\bHK\\b|Hong ?Kong|日本|🇯🇵|\\bJP\\b|Japan|新加坡|狮城|🇸🇬|\\bSG\\b|Singapore))"

# 普通自动池排除 ≤0.3x、≥5x 及 BETA。
exclude_lowrate: &exclude_lowrate "(?i)(BETA|wcloud|\\btraffic\\b|(?<![0-9.])(?:0\\.(?=[0-9]*[1-9])(?:[0-2][0-9]*|30*)|(?:[5-9]|[1-9][0-9]+)(?:\\.[0-9]+)?)(?:倍|x)(?![0-9A-Za-z.]))"

# 下载另排除 MITM 等特殊用途；倍率不代表速度。
exclude_download: &exclude_download "(?i)(?:BETA|wcloud|MITM|pornhub|\\btraffic\\b|(?<![0-9.])0\\.(?=[0-9]*[1-9])(?:[0-2][0-9]*|30*)(?:倍|x)(?![0-9A-Za-z.])|(?<![0-9.])(?:[5-9]|[1-9][0-9]+)(?:\\.[0-9]+)?(?:倍|x)(?![0-9A-Za-z.]))"
exclude_download_1: &exclude_download_1 "(?i)(?:BETA|wcloud|MITM|pornhub|\\btraffic\\b|(?<![0-9.])0\\.(?=[0-9]*[1-9])(?:[0-2][0-9]*|30*)(?:倍|x)(?![0-9A-Za-z.])|(?<![0-9.])(?:[5-9]|[1-9][0-9]+)(?:\\.[0-9]+)?(?:倍|x)(?![0-9A-Za-z.])|Hong ?Kong 0[2-5](?:\\D|$))"

# 机场名称3下载仅美国豁免低倍率；日新排除纯 CTCU，保留 CTCUCM。
exclude_download_3: &exclude_download_3 "(?i)(?:BETA|wcloud|MITM|pornhub|\\btraffic\\b|(?<![0-9.])(?:[5-9]|[1-9][0-9]+)(?:\\.[0-9]+)?(?:倍|x)(?![0-9A-Za-z.])|^(?!.*(美国|🇺🇸|🇺🇲|\\bUS\\b|\\bUSA\\b|America|United States|UnitedStates|Los Angeles|Chicago|Ashburn|Seattle|Kansas)).*(?<![0-9.])0\\.(?=[0-9]*[1-9])(?:[0-2][0-9]*|30*)(?:倍|x)(?![0-9A-Za-z.])|^(?=.*(?:(日本|🇯🇵|\\bJP\\b|Japan)|(新加坡|狮城|🇸🇬|\\bSG\\b|Singapore))).*(?<![0-9A-Za-z])CTCU(?:\\||$))"

use_ap_all: &use_ap_all [Airport_01, Airport_02, Airport_03, Airport_04]

# 订阅：固定 provider 键名；只改 url 及非空、唯一的显示前缀。
proxy-providers:
  Airport_01:
    <<: *PProviders
    proxy: DIRECT
    url: "订阅链接1"
    override:
      additional-prefix: '[机场名称1]'
      skip-cert-verify: true
      udp: true
  Airport_02:
    <<: *PProviders
    proxy: DIRECT
    url: "订阅链接2"
    override:
      additional-prefix: '[机场名称2]'
      skip-cert-verify: true
      udp: true
  Airport_03:
    <<: *PProviders
    proxy: DIRECT
    url: "订阅链接3"
    override:
      additional-prefix: '[机场名称3]'
      skip-cert-verify: true
      udp: true
  Airport_04:
    <<: *PProviders
    proxy: DIRECT
    url: "订阅链接4"
    override:
      additional-prefix: '[机场名称4]'
      skip-cert-verify: true
      udp: true

# 全局配置
global-ua: clash.meta

mode: rule
mixed-port: 7890
ipv6: false
allow-lan: true

# 探测计入首次建连和响应耗时。
unified-delay: false
tcp-concurrent: true
authentication: []
skip-auth-prefixes:
- 127.0.0.1/8
- ::1/128

# LAN 面板：部署时设置自己的密码。
external-controller: 0.0.0.0:9090
secret: "7a13b88333760a18574d3b32"
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 无进程规则，关闭进程匹配。
find-process-mode: "off"

profile:
  # 按候选名称保存手选；节点改名后无法原样恢复。
  store-selected: true
  store-fake-ip: true

# 流量嗅探
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080, 8888]
      override-destination: true
    TLS:
      ports: [443, 8443, 5228-5230]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    # 忽略米家非 DNS 握手名。
    - "Mijia Cloud"
    - "+.io.mi.com"
    - "+.apple.com"
    - "+.wechat.com"
    - "+.qpic.cn"
    - "+.qq.com"
    - "+.wechatapp.com"
    - "+.vivox.com"
    - "+.oray.com"
    - "+.sunlogin.net"

# TUN
tun:
  enable: true
  stack: system
  device: tun0
  mtu: 9000
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  strict-route: true
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS
dns:
  enable: true
  # Android 私人 DNS（DoT）不受 53 端口劫持。
  listen: 0.0.0.0:1053
  ipv6: false
  # 读取 hosts，不调用系统 DNS。
  use-system-hosts: true
  prefer-h3: false
  respect-rules: true
  # LRU 可先返回过期答案，再后台刷新。
  cache-algorithm: lru
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/15
  fake-ip-range6: fdfe:dcba:9876::/64
  fake-ip-filter-mode: rule
  fake-ip-filter:
    # 保留 Tunnel 的边缘地址池，避免每个区域缩为一个 Fake-IP。
    - "DOMAIN,region1.v2.argotunnel.com,real-ip"
    - "DOMAIN,region2.v2.argotunnel.com,real-ip"

    # 私有域与 STUN
    - "RULE-SET,private_domain,real-ip"

    - "RULE-SET,stun_domain,real-ip"

    # 联网探测与校时
    - "DOMAIN,connectivitycheck.gstatic.com,real-ip"
    - "DOMAIN-SUFFIX,msftconnecttest.com,real-ip"
    - "DOMAIN-SUFFIX,msftncsi.com,real-ip"
    - "DOMAIN-SUFFIX,pool.ntp.org,real-ip"
    - "DOMAIN-SUFFIX,time.windows.com,real-ip"
    - "DOMAIN-SUFFIX,time.apple.com,real-ip"
    - "DOMAIN-SUFFIX,ntp.org.cn,real-ip"

    # 混合过滤集：Real-IP 不代表固定解析器。
    - "RULE-SET,fakeip_filter_domain,real-ip"

    # 游戏、P2P 与特殊服务
    - "DOMAIN-SUFFIX,srv.nintendo.net,real-ip"
    - "DOMAIN-SUFFIX,stun.playstation.net,real-ip"
    - "DOMAIN-SUFFIX,xboxlive.com,real-ip"
    - "DOMAIN-SUFFIX,xbox.microsoft.com,real-ip"
    - "DOMAIN-SUFFIX,sandai.net,real-ip"
    - "DOMAIN-SUFFIX,n0808.com,real-ip"
    - "DOMAIN-SUFFIX,mcdn.bilivideo.cn,real-ip"
    - "DOMAIN-SUFFIX,proxy.golang.org,real-ip"
    - "DOMAIN-SUFFIX,steamserver.net,real-ip"
    - "RULE-SET,game_cn_domain,real-ip"
    - "RULE-SET,steam_cn_domain,real-ip"
    - "RULE-SET,pt_domain,real-ip"
    - "RULE-SET,public-tracker_domain,real-ip"
    - "RULE-SET,115_domain,real-ip"

    # 国内业务
    - "RULE-SET,wechat_domain,real-ip"
    - "RULE-SET,bank_cn_domain,real-ip"
    - "RULE-SET,alibaba_domain,real-ip"
    - "RULE-SET,xiaomi_domain,real-ip"
    - "RULE-SET,apple_cn_domain,real-ip"
    - "RULE-SET,ai_cn_domain,real-ip"

    # 国内媒体与总集合
    - "RULE-SET,NetEaseMusic_domain,real-ip"
    - "RULE-SET,media_cn_domain,real-ip"
    - "RULE-SET,iptv_domain,real-ip"
    - "RULE-SET,cn_domain,real-ip"

    - "MATCH,fake-ip"
  default-nameserver:
    # IP 字面量 DoH 仅用于引导，避免外部 53 端口回环。
    - https://223.5.5.5/dns-query
    - https://1.1.1.1/dns-query
  proxy-server-nameserver:
    - "https://dns.alidns.com/dns-query#DIRECT"
    - "https://doh.pub/dns-query#DIRECT"
  direct-nameserver:
    - "https://dns.alidns.com/dns-query#DIRECT"
    - "https://doh.pub/dns-query#DIRECT"
  # 本地域由上游 MosDNS/本地 DNS 截获，漏入此处返回 NXDOMAIN。
  # 不回退 system/DHCP；plex.direct 使用公开 DNS。
  nameserver-policy:
    "+.argotunnel.com":
      - "https://dns.alidns.com/dns-query#DIRECT"
      - "https://doh.pub/dns-query#DIRECT"
    "+.plex.direct":
      - "https://dns.alidns.com/dns-query#DIRECT"
      - "https://doh.pub/dns-query#DIRECT"
    "rule-set:private_domain": "rcode://name_error"
    "rule-set:cn_domain":
      - "https://dns.alidns.com/dns-query#DIRECT"
      - "https://doh.pub/dns-query#DIRECT"
    # 固定直连的 Real-IP 业务也需在首次查询时指定国内解析器。
    "rule-set:game_cn_domain,steam_cn_domain,pt_domain,public-tracker_domain,115_domain":
      - "https://dns.alidns.com/dns-query#DIRECT"
      - "https://doh.pub/dns-query#DIRECT"
    "rule-set:wechat_domain,bank_cn_domain,alibaba_domain,xiaomi_domain,apple_cn_domain,ai_cn_domain":
      - "https://dns.alidns.com/dns-query#DIRECT"
      - "https://doh.pub/dns-query#DIRECT"
    "rule-set:NetEaseMusic_domain,media_cn_domain,iptv_domain":
      - "https://dns.alidns.com/dns-query#DIRECT"
      - "https://doh.pub/dns-query#DIRECT"
  direct-nameserver-follow-policy: true
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query

