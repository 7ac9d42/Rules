# 四机场模板：填写真实的机场名称2家宽订阅后使用。
# 使用支持 rematch 的 Mihomo；固定验证版本为 v1.19.30。
# 机场名称1、机场名称2、机场名称3仅同地区测速；先同机场换地区，再跨机场；纯下载例外。
# 使用说明与维护入口见 README.md。

# 探测与回退
# use 组复用 provider 探测；额外 URL 的周期与超时仍由 provider 决定。
Urltest_Base: &Urltest_Base
  type: url-test
  timeout: 3500
  tolerance: 50
  max-failed-times: 3
  empty-fallback: REJECT
  expected-status: 204
  hidden: true

# GitHub /_ping 返回 200；CF、Google 探针返回 204。
GitHub_Urltest_Base: &GitHub_Urltest_Base
  <<: *Urltest_Base
  url: &github_test_url "https://codeload.github.com/_ping"
  expected-status: 200

Cloudflare_Urltest_Base: &Cloudflare_Urltest_Base
  <<: *Urltest_Base
  url: &cloudflare_test_url "https://cp.cloudflare.com/generate_204"
  expected-status: 204

# 空池拒绝连接；连接失败可触发强制复测。
Fallback_Base: &Fallback_Base
  type: fallback
  url: &google_test_url "https://www.gstatic.com/generate_204"
  expected-status: 204
  timeout: 3500
  interval: 30
  max-failed-times: 3
  lazy: true
  empty-fallback: REJECT

GitHub_Fallback_Base: &GitHub_Fallback_Base
  <<: *Fallback_Base
  url: *github_test_url
  expected-status: 200
  hidden: true

Cloudflare_Fallback_Base: &Cloudflare_Fallback_Base
  <<: *Fallback_Base
  url: *cloudflare_test_url
  expected-status: 204
  hidden: true

# 机场名称4按地区排序兜底，未知地区排最后。
