name: Sync Upstream Rules

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync_upstream_rules:
    name: Sync New Rules from Upstream
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync rules directory from upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Lanlan13-14/Rules.git || git remote set-url upstream https://github.com/Lanlan13-14/Rules.git
          # 禁用对 upstream 的 push 权限，确保绝不影响上游
          git remote set-url --push upstream PUSH_DISABLED
          git fetch upstream main

          # 仅精准同步上游 rules/ 目录，绝不触碰根目录及 configfull_new.yaml 等配置文件
          git checkout upstream/main -- rules/

          # 仅在 rules/ 目录有更新时提交
          if ! git diff --quiet HEAD -- rules/; then
            git commit -m "sync: update rules from upstream"
            git push origin main
          else
            echo "No new rules from upstream."
          fi
