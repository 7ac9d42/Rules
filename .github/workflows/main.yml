name: Sync and Build Rules

on:
  schedule:
    - cron: "0 0 * * *"  # 每天北京时间 08:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rules-write
  cancel-in-progress: false

jobs:
  sync_and_build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Sync upstream rules
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Lanlan13-14/Rules.git
          git remote set-url --push upstream PUSH_DISABLED
          git fetch --depth=1 upstream main
          git rm -r --ignore-unmatch rules/
          git checkout upstream/main -- rules/

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/mihomo/v1.19.30
          key: mihomo-${{ runner.os }}-${{ runner.arch }}-v1.19.30

      - name: Install build dependencies and fixed baseline
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq ruby
          binary="${RUNNER_TOOL_CACHE}/mihomo/v1.19.30/mihomo"
          if [[ ! -f "$binary" ]]; then
            mkdir -p "${binary%/*}"
            curl --fail --show-error --silent --location --max-time 120 \
              https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-amd64-v1.19.30.gz \
              -o "${RUNNER_TEMP}/mihomo.gz"
            gunzip -c "${RUNNER_TEMP}/mihomo.gz" > "$binary"
          fi
          chmod +x "$binary"
          version_output=$("$binary" -v)
          printf '%s\n' "$version_output"
          [[ "$version_output" == *"Mihomo Meta v1.19.30 "* || "$version_output" == *"Mihomo Meta 1.19.30 "* ]]
          echo "${binary%/*}" >> "$GITHUB_PATH"

      - name: Build and validate rule artifacts once
        run: |
          set -euo pipefail
          for script in scripts/build/*.sh; do
            bash "$script"
          done
          ruby scripts/validate-rules.rb

      - name: Publish rule changes
        run: |
          set -euo pipefail
          git add rules/
          if ! git diff-index --quiet HEAD -- rules/; then
            git commit -m "build: sync upstream and update generated rules"
            git push origin main
          else
            echo "No rule changes detected."
          fi
