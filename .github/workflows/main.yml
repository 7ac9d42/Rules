name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync_with_upstream:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Upstream (Prefer Local Modifications)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Lanlan13-14/Rules.git || git remote set-url upstream https://github.com/Lanlan13-14/Rules.git
          git fetch upstream main
          # 使用 -X ours 策略：发生冲突时优先采纳本地修改，未冲突部分正常合并上游修改
          git merge upstream/main -X ours -m "sync: merge upstream main with local priority (-X ours)" || {
            echo "[Error] Merge with upstream failed."
            exit 1
          }
          git push origin main
