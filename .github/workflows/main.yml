name: Sync and Build Rules

permissions:
  contents: write

concurrency:
  group: rules-write
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 0 * * *"  # 每天北京时间 08:00 执行
  workflow_dispatch:

jobs:
  sync_and_build:
    name: Sync upstream and build all rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Git and sync upstream rules
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Lanlan13-14/Rules.git ||
            git remote set-url upstream https://github.com/Lanlan13-14/Rules.git
          git remote set-url --push upstream PUSH_DISABLED
          git fetch upstream main

          # 精准镜像上游 rules/，包括上游删除；不触碰根目录及配置文件。
          git rm -r --ignore-unmatch rules/
          git checkout upstream/main -- rules/

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Resolve latest stable mihomo release
        id: mihomo-version
        run: |
          set -euo pipefail
          release_url=$(curl --fail --show-error --silent --location \
            --output /dev/null --write-out '%{url_effective}' \
            https://github.com/MetaCubeX/mihomo/releases/latest)
          version=${release_url##*/}
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected mihomo release tag: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache mihomo binary
        id: cache-mihomo
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/mihomo
          key: mihomo-bin-${{ runner.os }}-${{ steps.mihomo-version.outputs.version }}

      - name: Cache mihomo v1.19.19 compatibility binary
        id: cache-mihomo-compat
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/mihomo/v1.19.19/mihomo
          key: mihomo-bin-${{ runner.os }}-${{ runner.arch }}-v1.19.19

      - name: Install dependencies and mihomo
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq ruby

          if [[ "${{ steps.cache-mihomo.outputs.cache-hit }}" != "true" ]]; then
            version="${{ steps.mihomo-version.outputs.version }}"
            asset="mihomo-linux-amd64-v1-${version}.gz"
            curl --fail --show-error --silent --location \
              "https://github.com/MetaCubeX/mihomo/releases/download/${version}/${asset}" \
              -o mihomo.gz
            gunzip -c mihomo.gz > mihomo
            chmod +x mihomo
            sudo mv mihomo /usr/local/bin/
          else
            sudo chmod +x /usr/local/bin/mihomo
          fi

          mihomo -v

      - name: Install mihomo v1.19.19 compatibility binary
        env:
          MIHOMO_COMPAT_BIN: ${{ runner.tool_cache }}/mihomo/v1.19.19/mihomo
          MIHOMO_COMPAT_VERSION: v1.19.19
        run: |
          set -euo pipefail
          if [[ "${{ steps.cache-mihomo-compat.outputs.cache-hit }}" != "true" ]]; then
            compat_dir="${MIHOMO_COMPAT_BIN%/*}"
            archive="${RUNNER_TEMP}/mihomo-${MIHOMO_COMPAT_VERSION}.gz"
            asset="mihomo-linux-amd64-${MIHOMO_COMPAT_VERSION}.gz"
            mkdir -p "$compat_dir"
            curl --fail --show-error --silent --location \
              "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_COMPAT_VERSION}/${asset}" \
              -o "$archive"
            gunzip -c "$archive" > "$MIHOMO_COMPAT_BIN"
          fi

          chmod +x "$MIHOMO_COMPAT_BIN"
          version_output=$("$MIHOMO_COMPAT_BIN" -v)
          printf '%s\n' "$version_output"
          if [[ "$version_output" != *"Mihomo Meta ${MIHOMO_COMPAT_VERSION} "* ]]; then
            echo "Unexpected compatibility mihomo version" >&2
            exit 1
          fi

      - name: Build all rules
        run: |
          set -euo pipefail
          for script in scripts/build/*.sh; do
            [[ -f "$script" ]] || continue
            echo "Running $script ..."
            bash "$script"
          done

      - name: Validate generated rules and configuration
        run: |
          set -euo pipefail
          ruby scripts/validate-rules.rb

      - name: Validate with mihomo v1.19.19
        env:
          MIHOMO_BIN: ${{ runner.tool_cache }}/mihomo/v1.19.19/mihomo
        run: |
          set -euo pipefail
          ruby scripts/validate-rules.rb

      - name: Commit and push rule changes
        run: |
          set -euo pipefail
          git add rules/
          if ! git diff-index --quiet HEAD -- rules/; then
            git commit -m "build: sync upstream and update generated rules"
            git push origin main
          else
            echo "No rule changes detected."
          fi
